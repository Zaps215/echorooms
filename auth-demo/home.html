<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoRooms — Home</title>
  <meta name="description" content="EchoRooms — realtime rooms for teams." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="home.css" />
</head>
<body class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <header class="side-head">
      <div class="side-brand">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h10" /><circle cx="19" cy="18" r="2.5" />
          </svg>
        </div>
        <span class="side-title">EchoRooms</span>
      </div>

      <div class="side-search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="room-search" type="text" placeholder="Search" autocomplete="off" />
      </div>
    </header>

    <nav class="side-tabs">
      <button class="tab active" data-tab="all">All</button>
      <button class="tab" data-tab="unread">Unread</button>
      <button class="tab" data-tab="groups">Groups</button>
    </nav>

    <div class="room-list" id="room-list">
      <!-- Rooms injected by JS -->
    </div>

    <footer class="side-me">
      <div class="me-avatar" id="me-avatar">ZK</div>
      <div class="me-info">
        <span class="me-name">Zaps</span>
        <span class="me-status">online</span>
      </div>
      <button class="icon-btn" title="New room" id="btn-new-room">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </footer>
  </aside>

  <!-- ============ MESSAGES ============ -->
  <main class="chat" id="chat">

    <div class="chat-empty" id="chat-empty">
      <div class="empty-mark">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2.5"/></svg>
      </div>
      <h2>Select a room</h2>
      <p>Choose a conversation from the sidebar to start messaging.</p>
    </div>

    <div class="chat-active hidden" id="chat-active">
      <header class="chat-head">
        <button class="icon-btn mobile-back" id="btn-back">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <div class="chat-title-group">
          <h3 id="chat-title">Room name</h3>
          <span class="chat-subtitle" id="chat-subtitle">members online</span>
        </div>
        <div class="chat-head-actions">
          <button class="icon-btn" title="Search in room">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button class="icon-btn" title="More">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages">
        <!-- Messages injected by JS -->
      </div>

      <footer class="composer">
        <div class="composer-row">
          <button class="icon-btn composer-icon" title="Attach">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea id="composer-input" rows="1" placeholder="Message"></textarea>
          <button class="icon-btn composer-icon" title="Emoji">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </button>
          <button class="send-btn" id="btn-send" title="Send">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a.993.993 0 0 0-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg>
          </button>
        </div>
      </footer>
    </div>

  </main>

  <!-- ============ INFO PANEL ============ -->
  <aside class="info" id="info">
    <div class="info-head">
      <h3>Room details</h3>
      <button class="icon-btn" id="btn-close-info" title="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="info-sections">
      <section class="info-card" id="panel-members">
        <h4>Members</h4>
        <ul class="member-list" id="member-list"></ul>
      </section>

      <section class="info-card" id="panel-pinned">
        <h4>Pinned</h4>
        <ul class="pinned-list" id="pinned-list"></ul>
      </section>

      <section class="info-card" id="panel-tasks">
        <h4>Tasks</h4>
        <ul class="task-list" id="task-list"></ul>
      </section>
    </div>

    <footer class="info-foot">Demo — frontend only. Nothing is connected or stored.</footer>
  </aside>

  <script src="home.js"></script>
</body>
</html>
