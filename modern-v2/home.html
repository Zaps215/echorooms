<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoRooms — Atrium</title>
  <meta name="description" content="EchoRooms — where conversations become knowledge." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="home.css" />
</head>
<body class="app">

  <!-- Ambient aurora backdrops -->
  <div class="aurora" aria-hidden="true"></div>

  <!-- ============ RAIL ============ -->
  <nav class="rail">
    <div class="rail-brand" title="EchoRooms">
      <span class="rail-mark">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h9"/><circle cx="19" cy="17" r="2.4"/></svg>
      </span>
    </div>

    <div class="rail-actions">
      <button class="rail-btn active" title="Rooms">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="3.5"/><circle cx="16" cy="10" r="2.5"/><path d="M2.5 19c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5M14.5 18.5h.5c3 0 5.5-1.8 6-4.5"/></svg>
      </button>
      <button class="rail-btn" title="Tasks">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.6"/><circle cx="4.5" cy="12" r="1.6"/><circle cx="4.5" cy="18" r="1.6"/></svg>
      </button>
      <button class="rail-btn" title="Search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.4" y2="16.4"/></svg>
      </button>
    </div>

    <div class="rail-bottom">
      <div class="rail-user" title="Zaps" id="rail-user">Z</div>
    </div>
  </nav>

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <header class="side-head">
      <div class="side-title-row">
        <h1 class="side-title">Rooms</h1>
        <button class="ghost-btn" id="btn-new-room" title="New room">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>

      <div class="side-search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.4" y2="16.4"/></svg>
        <input id="room-search" type="text" placeholder="Find a room…" autocomplete="off" />
      </div>
    </header>

    <div class="room-list" id="room-list"></div>

    <footer class="side-me">
      <div class="me-avatar" id="me-avatar">Z</div>
      <div class="me-info">
        <span class="me-name">Zaps</span>
        <span class="me-status">• Focused</span>
      </div>
      <button class="ghost-btn" title="Log out" id="btn-logout">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </footer>
  </aside>

  <!-- ============ CHAT ============ -->
  <main class="chat">

    <div class="chat-empty" id="chat-empty">
      <div class="empty-orbit">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2.5"/></svg>
      </div>
      <h2>Step into a room</h2>
      <p>Select a room to open your conversation workspace.</p>
    </div>

    <div class="chat-active hidden" id="chat-active">
      <header class="chat-head">
        <button class="icon-btn mobile-back" id="btn-back">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <div class="chat-title-group">
          <h3 id="chat-title">Room</h3>
          <span class="chat-subtitle" id="chat-subtitle">members online</span>
        </div>
        <div class="chat-head-actions">
          <button class="icon-btn" title="Search in room" id="btn-inroom-search">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.4" y2="16.4"/></svg>
          </button>
          <button class="icon-btn" title="Room details" id="btn-info">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="12" y2="18"/></svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <footer class="composer">
        <div class="composer-inner">
          <button class="composer-icon" title="Attach">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea id="composer-input" rows="1" placeholder="Message the room…"></textarea>
          <button class="composer-icon" title="Emoji">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><line x1="8.5" y1="14.5" x2="15.5" y2="14.5"/><line x1="9" y1="9" x2="9.02" y2="9"/><line x1="15" y1="9" x2="15.02" y2="9"/></svg>
          </button>
          <button class="send-btn" id="btn-send" title="Send">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </footer>
    </div>

  </main>

  <!-- ============ INFO PANEL ============ -->
  <aside class="info" id="info">
    <header class="info-head">
      <div>
        <h3>Workspace</h3>
        <span class="info-head-sub" id="info-head-sub">Room details</span>
      </div>
      <button class="icon-btn" id="btn-close-info" title="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>

    <div class="info-sections">
      <section class="info-card">
        <div class="card-head"><h4>Members</h4><span class="badge" id="member-count">0</span></div>
        <ul class="member-list" id="member-list"></ul>
      </section>

      <section class="info-card">
        <div class="card-head"><h4>Pinned</h4></div>
        <ul class="pinned-list" id="pinned-list"></ul>
      </section>

      <section class="info-card">
        <div class="card-head"><h4>Tasks</h4></div>
        <ul class="task-list" id="task-list"></ul>
      </section>
    </div>

    <footer class="info-foot">Concept preview — no backend connected.</footer>
  </aside>

  <script src="home.js"></script>
</body>
</html>
